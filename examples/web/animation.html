<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moon_rough 动画</title>
<link rel="stylesheet" href="style.css">
<style>
  .controls .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .controls .check input { width: auto; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .buttons button { flex: 1; }
  .canvases.single { grid-template-columns: 1fr; max-width: 460px; }
</style>
</head>
<body>
<header>
  <h1>moon_rough 动画</h1>
  <p>两种用法，都只靠 rough.js 本来就有的行为：每一帧换一个 seed，线条就抖起来；只画前 k 个 op，笔就一笔一笔写出图形。每一帧都和官方 rough.js 4.6.6 对比。<a href="index.html">← 单张对比</a></p>
</header>
<main>
  <div class="layout">
    <section class="card controls" aria-label="参数">
      <label for="mode">动画</label>
      <select id="mode">
        <option value="jitter">抖动线条：每帧换一个 seed</option>
        <option value="drawon">描线：一笔一笔画出来</option>
      </select>

      <label for="fps">帧率（帧 / 秒）</label>
      <div class="row"><input id="fps" type="range" min="1" max="60" step="1" value="8"><output for="fps"></output></div>

      <label for="roughness">roughness</label>
      <div class="row"><input id="roughness" type="range" min="0" max="3" step="0.1" value="1"><output for="roughness"></output></div>

      <label class="check" for="compare"><input id="compare" type="checkbox" checked>和官方 rough.js 对比</label>

      <div class="buttons">
        <button id="play" type="button">暂停</button>
        <button id="step" type="button" title="暂停时前进一帧">单步</button>
      </div>
    </section>

    <div>
      <div class="canvases" id="canvases">
        <figure>
          <canvas id="mine" width="420" height="320"></canvas>
          <figcaption><b>moon_rough</b>（MoonBit，经 Canvas 后端）<span id="frameLabel"></span></figcaption>
        </figure>
        <figure id="officialFigure">
          <canvas id="official" width="420" height="320"></canvas>
          <figcaption><b>rough.js 4.6.6</b>（官方）</figcaption>
        </figure>
      </div>

      <section class="card" style="margin-top:16px" aria-live="off">
        <p class="verdict"><span id="verdict" class="badge">…</span><span id="verdictText"></span></p>
        <ul class="checks" id="checks"></ul>
        <ul class="notes" id="notes"></ul>
      </section>
    </div>
  </div>
</main>
<footer>
  代码和说明：<a href="https://github.com/sayoi7799/moon_rough">github.com/sayoi7799/moon_rough</a>。
  官方 rough.js 以 MIT 许可证随页面分发，见 <a href="vendor/LICENSE">vendor/LICENSE</a>。
</footer>

<script src="vendor/rough.js"></script>
<script type="module" src="animation.js"></script>
</body>
</html>
