<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moon_rough 对比 rough.js</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>moon_rough 对比 rough.js</h1>
  <p>左边是 MoonBit 移植版画的，右边是官方 rough.js 4.6.6 画的，输入完全相同。下面实时对比两边的输出。<a href="animation.html">看动画 →</a></p>
</header>
<main>
  <div class="layout">
    <section class="card controls" aria-label="参数">
      <label for="shape">图形</label>
      <select id="shape"></select>

      <label for="fillStyle">填充样式</label>
      <select id="fillStyle"></select>

      <label for="roughness">roughness</label>
      <div class="row"><input id="roughness" type="range" min="0" max="5" step="0.1" value="1"><output for="roughness"></output></div>

      <label for="bowing">bowing</label>
      <div class="row"><input id="bowing" type="range" min="0" max="10" step="0.1" value="1"><output for="bowing"></output></div>

      <label for="hachureAngle">hachureAngle（度）</label>
      <div class="row"><input id="hachureAngle" type="range" min="-180" max="180" step="1" value="-41"><output for="hachureAngle"></output></div>

      <label for="hachureGap">hachureGap</label>
      <div class="row"><input id="hachureGap" type="range" min="1" max="30" step="1" value="8"><output for="hachureGap"></output></div>

      <label for="strokeWidth">strokeWidth</label>
      <div class="row"><input id="strokeWidth" type="range" min="0.5" max="6" step="0.5" value="2"><output for="strokeWidth"></output></div>

      <label for="seed">seed</label>
      <div class="row">
        <input id="seed" type="number" min="1" max="2147483647" step="1" value="42">
        <button id="randomSeed" type="button" title="换一个随机的 seed">随机</button>
      </div>

      <div class="colors">
        <label for="stroke"><input id="stroke" type="color" value="#1d3557">线条</label>
        <label for="fill"><input id="fill" type="color" value="#e76f51">填充</label>
      </div>
    </section>

    <div>
      <div class="canvases">
        <figure>
          <canvas id="mine" width="420" height="320"></canvas>
          <figcaption><b>moon_rough</b>（MoonBit，经 Canvas 后端）</figcaption>
        </figure>
        <figure>
          <canvas id="official" width="420" height="320"></canvas>
          <figcaption><b>rough.js 4.6.6</b>（官方）</figcaption>
        </figure>
      </div>

      <section class="card" style="margin-top:16px" aria-live="polite">
        <p class="verdict"><span id="verdict" class="badge">…</span><span id="verdictText"></span></p>
        <ul class="checks" id="checks"></ul>
        <ul class="notes" id="notes"></ul>
      </section>
    </div>
  </div>
</main>
<footer>
  代码和说明：<a href="https://github.com/sayoi7799/moon_rough">github.com/sayoi7799/moon_rough</a>。
  官方 rough.js 以 MIT 许可证随页面分发，见 <a href="vendor/LICENSE">vendor/LICENSE</a>。
</footer>

<script src="vendor/rough.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
