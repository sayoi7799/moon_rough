<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moon_rough 对比 rough.js</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --line: #d8d6cf;
    --accent: #1d5fd1;
    --ok: #1a7f37;
    --ok-bg: #dcf3e2;
    --warn: #8a5a00;
    --warn-bg: #fdf0c9;
    --bad: #b42318;
    --bad-bg: #fde2df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --card: #1f2227;
      --text: #e6e8ea;
      --muted: #9aa3ad;
      --line: #343942;
      --accent: #7aa7ff;
      --ok: #56d364;
      --ok-bg: #12301c;
      --warn: #e3b341;
      --warn-bg: #33270b;
      --bad: #ff8a80;
      --bad-bg: #3a1714;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header, main, footer { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; padding-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .controls label { display: block; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .controls label:first-child { margin-top: 0; }
  .controls .row { display: flex; align-items: center; gap: 8px; }
  .controls output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  select, input[type="number"], button {
    width: 100%; padding: 6px 8px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  }
  button { cursor: pointer; width: auto; }
  input[type="range"] { flex: 1; min-width: 0; }
  input[type="color"] { width: 44px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .colors { display: flex; gap: 16px; margin-top: 10px; }
  .colors label { margin: 0; display: flex; align-items: center; gap: 8px; }
  .canvases { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .canvases figure { margin: 0; }
  .canvases canvas { display: block; width: 100%; height: auto; aspect-ratio: 420 / 320; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  figcaption { margin-top: 6px; font-size: 13px; color: var(--muted); }
  figcaption b { color: var(--text); }
  .verdict { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 13px; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 4.5em 1.6em 1fr; gap: 4px; padding: 4px 0; border-top: 1px solid var(--line); }
  .checks li:first-child { border-top: 0; }
  .checks .name { color: var(--muted); }
  .checks .mark.ok { color: var(--ok); }
  .checks .mark.warn { color: var(--warn); }
  .checks .mark.bad { color: var(--bad); }
  .notes { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .notes li { margin-top: 4px; }
  code { font: 12.5px ui-monospace, "SF Mono", Consolas, monospace; }
  .error { color: var(--bad); }
  footer { padding-top: 16px; padding-bottom: 28px; font-size: 13px; color: var(--muted); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .canvases { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>moon_rough 对比 rough.js</h1>
  <p>左边是 MoonBit 移植版画的，右边是官方 rough.js 4.6.6 画的，输入完全相同。下面实时对比两边的输出。</p>
</header>
<main>
  <div class="layout">
    <section class="card controls" aria-label="参数">
      <label for="shape">图形</label>
      <select id="shape"></select>

      <label for="fillStyle">填充样式</label>
      <select id="fillStyle"></select>

      <label for="roughness">roughness</label>
      <div class="row"><input id="roughness" type="range" min="0" max="5" step="0.1" value="1"><output for="roughness"></output></div>

      <label for="bowing">bowing</label>
      <div class="row"><input id="bowing" type="range" min="0" max="10" step="0.1" value="1"><output for="bowing"></output></div>

      <label for="hachureAngle">hachureAngle（度）</label>
      <div class="row"><input id="hachureAngle" type="range" min="-180" max="180" step="1" value="-41"><output for="hachureAngle"></output></div>

      <label for="hachureGap">hachureGap</label>
      <div class="row"><input id="hachureGap" type="range" min="1" max="30" step="1" value="8"><output for="hachureGap"></output></div>

      <label for="strokeWidth">strokeWidth</label>
      <div class="row"><input id="strokeWidth" type="range" min="0.5" max="6" step="0.5" value="2"><output for="strokeWidth"></output></div>

      <label for="seed">seed</label>
      <div class="row">
        <input id="seed" type="number" min="1" max="2147483647" step="1" value="42">
        <button id="randomSeed" type="button" title="换一个随机的 seed">随机</button>
      </div>

      <div class="colors">
        <label for="stroke"><input id="stroke" type="color" value="#1d3557">线条</label>
        <label for="fill"><input id="fill" type="color" value="#e76f51">填充</label>
      </div>
    </section>

    <div>
      <div class="canvases">
        <figure>
          <canvas id="mine" width="420" height="320"></canvas>
          <figcaption><b>moon_rough</b>（MoonBit，经 Canvas 后端）</figcaption>
        </figure>
        <figure>
          <canvas id="official" width="420" height="320"></canvas>
          <figcaption><b>rough.js 4.6.6</b>（官方）</figcaption>
        </figure>
      </div>

      <section class="card" style="margin-top:16px" aria-live="polite">
        <p class="verdict"><span id="verdict" class="badge">…</span><span id="verdictText"></span></p>
        <ul class="checks" id="checks"></ul>
        <ul class="notes" id="notes"></ul>
      </section>
    </div>
  </div>
</main>
<footer>
  代码和说明：<a href="https://github.com/sayoi7799/moon_rough">github.com/sayoi7799/moon_rough</a>。
  官方 rough.js 以 MIT 许可证随页面分发，见 <a href="vendor/LICENSE">vendor/LICENSE</a>。
</footer>

<script src="vendor/rough.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
