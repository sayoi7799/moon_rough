name: Pages

# Publishes examples/web as a GitHub Pages site.
#
# One-time setup in the repository settings:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: add
#      PAGES_ENABLED = true.
# Until the variable exists the job is skipped, so a repository without
# Pages does not get a failing workflow. It can also be run by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MOONBIT_VERSION: 0.10.16+b1a0e846e

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MoonBit ${{ env.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the demo
        run: node examples/web/build.mjs

      - name: Collect the site
        run: |
          mkdir _site
          cp examples/web/index.html examples/web/app.js examples/web/compare.mjs \
            examples/web/spec.mjs examples/web/moon_rough_demo.js _site/
          cp -r examples/web/vendor _site/vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
